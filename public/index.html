<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design your kitchen, right now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="hero">
    <h1>Design your kitchen, right now</h1>
    <p>Upload a photo, tell us your style, and see your kitchen transformed.</p>
  </header>

  <main class="studio" id="studio" aria-live="polite">
    <div class="studio-top">
      <div class="brand"><span class="dot"></span><span id="brandName">AI Design Studio</span></div>
      <div class="progress" id="progress" aria-hidden="true"></div>
      <div class="step-count" id="stepCount">Step 1 of 7</div>
    </div>

    <section class="studio-body" id="body"></section>

    <footer class="studio-foot" id="foot">
      <button class="btn-ghost" id="backBtn" type="button">← Back</button>
      <button class="btn-skip" id="skipBtn" type="button">Skip</button>
      <button class="btn-primary" id="nextBtn" type="button">Continue →</button>
    </footer>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
